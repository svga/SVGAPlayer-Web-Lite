<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVGAPlayer Remote Playback</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f5f7fa;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      background: #fff;
      color: #17202a;
      font-size: 14px;
      cursor: pointer;
    }

    select,
    input {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      background: #fff;
      color: #17202a;
      font-size: 14px;
    }

    input {
      min-width: min(520px, 100%);
      flex: 1 1 320px;
    }

    label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 14px;
    }

    .summary {
      margin: 12px 0 16px;
      min-height: 24px;
      font-size: 15px;
      font-weight: 600;
    }

    .summary.pass {
      color: #157347;
    }

    .summary.fail {
      color: #b42318;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .panel {
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .status {
      min-height: 42px;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .status.pass {
      color: #157347;
    }

    .status.fail {
      color: #b42318;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #111820;
      border: 1px solid #c8d2dc;
    }

    pre {
      overflow: auto;
      max-height: 180px;
      padding: 12px;
      background: #111820;
      color: #d8e1ea;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>SVGAPlayer Remote Playback</h1>
    <div class="toolbar">
      <label>
        Source
        <select id="sourcePreset"></select>
      </label>
      <input id="customSource" type="url" placeholder="Custom SVGA URL">
      <label>
        Mode
        <select id="renderMode">
          <option value="all">all</option>
          <option value="canvas">canvas</option>
          <option value="auto">auto</option>
          <option value="webgl">webgl</option>
        </select>
      </label>
      <button id="runSelected">Run Selected</button>
      <button id="runAll">Run All Modes</button>
      <button id="playAll">Play All</button>
      <button id="pauseAll">Pause All</button>
      <button id="resumeAll">Resume All</button>
      <button id="stopAll">Stop All</button>
      <button id="loseContext">Lose WebGL Context</button>
      <button id="restoreContext">Restore WebGL Context</button>
      <button id="destroyAll">Destroy All</button>
    </div>
    <div id="summary" class="summary">Ready. Choose a source and mode, or run canvas, auto, and webgl together.</div>
    <div class="grid">
      <section class="panel" data-mode="canvas">
        <h2>canvas</h2>
        <canvas id="canvas-canvas" width="520" height="520"></canvas>
        <div id="status-canvas" class="status">idle</div>
      </section>
      <section class="panel" data-mode="auto">
        <h2>auto</h2>
        <canvas id="canvas-auto" width="520" height="520"></canvas>
        <div id="status-auto" class="status">idle</div>
      </section>
      <section class="panel" data-mode="webgl">
        <h2>webgl</h2>
        <canvas id="canvas-webgl" width="520" height="520"></canvas>
        <div id="status-webgl" class="status">idle</div>
      </section>
    </div>
    <pre id="log"></pre>
  </main>

  <script src="../dist/index.min.js"></script>
  <script>
    const sourcePresets = [
      {
        label: 'Local rect fill',
        value: 'svga/rect-fill.svga'
      },
      {
        label: 'Local rect stroke',
        value: 'svga/rect-stroke.svga'
      },
      {
        label: 'Local rounded rect fill',
        value: 'svga/rounded-rect-fill.svga'
      },
      {
        label: 'Local rounded rect stroke',
        value: 'svga/rounded-rect-stroke.svga'
      },
      {
        label: 'Local ellipse fill',
        value: 'svga/ellipse-fill.svga'
      },
      {
        label: 'Local ellipse stroke',
        value: 'svga/ellipse-stroke.svga'
      },
      {
        label: 'Remote half common',
        value: 'https://static-web.bigolive.tv/as/fhab-static/84747/half-common.svga'
      },
      {
        label: 'Custom URL',
        value: 'custom'
      }
    ]
    const modes = ['canvas', 'auto', 'webgl']
    const tests = {}
    let loseContext = null

    function write(message) {
      const log = document.getElementById('log')
      log.textContent = `${new Date().toLocaleTimeString()} ${message}\n${log.textContent}`
    }

    function setSummary(message, className) {
      const summary = document.getElementById('summary')
      summary.className = `summary ${className || ''}`.trim()
      summary.textContent = message
    }

    function setStatus(mode, message, className) {
      const status = document.getElementById(`status-${mode}`)
      status.className = `status ${className || ''}`.trim()
      status.textContent = message
    }

    function getReplaceLayout(video, key) {
      const sprite = video.sprites.find(item => item.imageKey === key)
      const frame = sprite && sprite.frames.find(item => item.layout && item.layout.width > 0 && item.layout.height > 0)
      if (!frame) return { width: 160, height: 80 }
      return {
        width: Math.max(1, Math.round(frame.layout.width)),
        height: Math.max(1, Math.round(frame.layout.height))
      }
    }

    function fitFontSize(context, text, maxWidth, maxHeight, weight) {
      let size = Math.floor(maxHeight)
      while (size > 8) {
        context.font = `${weight} ${size}px sans-serif`
        if (context.measureText(text).width <= maxWidth) return size
        size -= 2
      }
      return size
    }

    function createImageReplacement(mode, layout) {
      const canvas = document.createElement('canvas')
      canvas.width = layout.width
      canvas.height = layout.height
      const context = canvas.getContext('2d')
      const width = canvas.width
      const height = canvas.height
      const minSize = Math.min(width, height)
      const gradient = context.createLinearGradient(0, 0, width, height)
      gradient.addColorStop(0, '#16a34a')
      gradient.addColorStop(0.5, '#facc15')
      gradient.addColorStop(1, '#2563eb')
      context.fillStyle = gradient
      context.fillRect(0, 0, width, height)
      context.fillStyle = 'rgba(255, 255, 255, 0.18)'
      context.beginPath()
      context.arc(width / 2, height / 2, minSize * 0.36, 0, Math.PI * 2)
      context.fill()
      context.strokeStyle = '#ffffff'
      context.lineWidth = Math.max(2, minSize * 0.025)
      context.strokeRect(context.lineWidth, context.lineWidth, width - context.lineWidth * 2, height - context.lineWidth * 2)
      context.fillStyle = '#0f172a'
      context.textAlign = 'center'
      context.textBaseline = 'middle'
      fitFontSize(context, mode.toUpperCase(), width * 0.82, height * 0.36, 700)
      context.fillText(mode.toUpperCase(), width / 2, height / 2)
      return canvas
    }

    function createTitleReplacement(mode, layout) {
      const canvas = document.createElement('canvas')
      canvas.width = layout.width
      canvas.height = layout.height
      const context = canvas.getContext('2d')
      const width = canvas.width
      const height = canvas.height
      const padding = Math.max(2, Math.min(width, height) * 0.08)
      context.fillStyle = '#7c2d12'
      context.fillRect(0, 0, width, height)
      context.fillStyle = '#fed7aa'
      context.fillRect(padding, padding, width - padding * 2, height - padding * 2)
      context.fillStyle = '#111827'
      context.textAlign = 'center'
      context.textBaseline = 'middle'
      const text = `TITLE ${mode.toUpperCase()}`
      fitFontSize(context, text, width * 0.82, height * 0.5, 800)
      context.fillText(text, width / 2, height / 2)
      return canvas
    }

    function getDefaultSlot(player) {
      const slots = player && player.slots
      if (!slots || typeof slots.get !== 'function') {
        throw new Error('SVGAPlayer slots Map is unavailable')
      }

      const slot = slots.get('default')
      if (!slot) {
        throw new Error("SVGAPlayer.load('default') did not create a slot")
      }

      return slot
    }

    function applyCanvasReplacements(player, video, mode) {
      const keys = video.sprites.map(item => item.imageKey)
      if (!keys.includes('image') && !keys.includes('title')) {
        write(`${mode} no image/title replacement targets`)
        return
      }

      const imageLayout = getReplaceLayout(video, 'image')
      const titleLayout = getReplaceLayout(video, 'title')
      if (keys.includes('image')) player.replace('image', createImageReplacement(mode, imageLayout))
      if (keys.includes('title')) player.replace('title', createTitleReplacement(mode, titleLayout))
      write(`${mode} replaced image ${imageLayout.width}x${imageLayout.height} and title ${titleLayout.width}x${titleLayout.height}`)
    }

    function selectedModes() {
      const mode = document.getElementById('renderMode').value
      return mode === 'all' ? modes : [mode]
    }

    function selectedSource() {
      const preset = document.getElementById('sourcePreset').value
      if (preset !== 'custom') return preset

      const custom = document.getElementById('customSource').value.trim()
      if (!custom) throw new Error('Custom SVGA URL is empty')
      return custom
    }

    function updateSummary(activeModes) {
      const expectedModes = activeModes || selectedModes()
      const values = expectedModes.map(mode => tests[mode])
      if (values.some(test => test && test.failed)) {
        setSummary('FAIL: at least one render mode failed.', 'fail')
        return
      }
      if (values.every(test => test && test.passed)) {
        setSummary(`PASS: ${expectedModes.join(', ')} ${expectedModes.length === 1 ? 'is' : 'are'} playing.`, 'pass')
        return
      }
      setSummary(`Running: waiting for ${expectedModes.join(', ')} to render frames.`, '')
    }

    function destroyAll() {
      modes.forEach(mode => {
        if (tests[mode] && tests[mode].player) {
          tests[mode].player.destroy()
        }
        tests[mode] = null
        setStatus(mode, 'idle', '')
      })
      loseContext = null
    }

    function markFailure(mode, error) {
      const message = error instanceof Error ? error.message : String(error)
      const test = tests[mode] || {
        mode,
        player: null,
        backendType: 'unknown',
        framesSeen: 0,
        passed: false,
        failed: false
      }
      tests[mode] = test
      test.failed = true
      setStatus(mode, `failed: ${message}`, 'fail')
      write(`${mode} failed: ${message}`)
      updateSummary()
    }

    async function runMode(mode, source, activeModes) {
      const canvas = document.getElementById(`canvas-${mode}`)
      const test = {
        mode,
        player: new SVGA.SVGAPlayer({
          container: canvas,
          renderMode: mode,
          loop: 0
        }),
        backendType: 'unknown',
        framesSeen: 0,
        passed: false,
        failed: false
      }

      tests[mode] = test
      setStatus(mode, 'loading', '')

      test.player.on('error', error => markFailure(mode, error))
      test.player.on('process', ({ currentFrame, progress }) => {
        test.framesSeen += 1
        if (!test.passed && test.framesSeen >= 3) {
          test.passed = true
          write(`${mode} passed via backend ${test.backendType}`)
        }
        setStatus(
          mode,
          `frame ${currentFrame}, progress ${(progress * 100).toFixed(1)}%, backend ${test.backendType}`,
          test.passed ? 'pass' : ''
        )
        updateSummary(activeModes)
      })

      await test.player.load(source)
      const slot = getDefaultSlot(test.player)
      const video = slot.video
      applyCanvasReplacements(test.player, video, mode)
      await test.player.prepare()
      const compiled = getDefaultSlot(test.player).compiledAnimation
      if (!compiled) {
        throw new Error('SVGAPlayer.prepare() did not compile animation')
      }
      test.backendType = compiled.backendType || 'unknown'
      setStatus(mode, `compiled ${video.frames} frames, ${video.fps}fps, backend ${compiled.backendType}`, '')
      test.player.start()
      write(`${mode} started via backend ${compiled.backendType}`)
      if (video.frames <= 1 && !test.passed) {
        if (typeof test.player.drawFrame === 'function') test.player.drawFrame(0)
        test.passed = true
        setStatus(mode, `single frame rendered, backend ${test.backendType}`, 'pass')
        updateSummary(activeModes)
      }
    }

    async function runModes(activeModes) {
      const source = selectedSource()
      destroyAll()
      setSummary(`Running: loading ${activeModes.join(', ')}.`, '')
      write(`loading ${source}`)
      await Promise.all(activeModes.map(mode => runMode(mode, source, activeModes).catch(error => markFailure(mode, error))))
      updateSummary(activeModes)
    }

    async function runSelectedModes() {
      try {
        await runModes(selectedModes())
      } catch (error) {
        setSummary(error instanceof Error ? error.message : String(error), 'fail')
        write(`run failed: ${error instanceof Error ? error.message : String(error)}`)
      }
    }

    async function runAllModes() {
      try {
        await runModes(modes)
      } catch (error) {
        setSummary(error instanceof Error ? error.message : String(error), 'fail')
        write(`run failed: ${error instanceof Error ? error.message : String(error)}`)
      }
    }

    const sourcePreset = document.getElementById('sourcePreset')
    sourcePresets.forEach(item => {
      const option = document.createElement('option')
      option.value = item.value
      option.textContent = item.label
      sourcePreset.appendChild(option)
    })
    sourcePreset.onchange = () => {
      const customSource = document.getElementById('customSource')
      customSource.disabled = sourcePreset.value !== 'custom'
      if (sourcePreset.value !== 'custom') customSource.value = sourcePreset.value
    }
    sourcePreset.onchange()

    document.getElementById('runSelected').onclick = () => runSelectedModes()
    document.getElementById('runAll').onclick = () => runAllModes()
    document.getElementById('playAll').onclick = () => modes.forEach(mode => tests[mode] && tests[mode].player.play())
    document.getElementById('pauseAll').onclick = () => modes.forEach(mode => tests[mode] && tests[mode].player.pause())
    document.getElementById('resumeAll').onclick = () => modes.forEach(mode => tests[mode] && tests[mode].player.resume())
    document.getElementById('stopAll').onclick = () => modes.forEach(mode => tests[mode] && tests[mode].player.stop())
    document.getElementById('destroyAll').onclick = () => {
      destroyAll()
      setSummary('Destroyed. Run all modes again to retest.', '')
      write('destroyed all players')
    }
    document.getElementById('loseContext').onclick = () => {
      const canvas = document.getElementById('canvas-webgl')
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl')
      loseContext = gl && gl.getExtension('WEBGL_lose_context')
      if (!loseContext) {
        write('WEBGL_lose_context unavailable')
        return
      }
      loseContext.loseContext()
      write('requested webgl mode context loss')
    }
    document.getElementById('restoreContext').onclick = () => {
      if (!loseContext) {
        write('no lost WebGL context to restore')
        return
      }
      loseContext.restoreContext()
      write('requested webgl mode context restore')
    }

    runSelectedModes()
  </script>
</body>
</html>
