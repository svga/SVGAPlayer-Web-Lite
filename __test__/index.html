<!DOCTYPE html>
<html lang="en">
<head>
  <title>SVGA Lite Demo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="maximum-scale=1, width=750, initial-scale=1, user-scalable=0">
  <style>
    #canvas {
      max-width: 100%;
      background-color: black;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 20px auto;
      max-width: 800px;
    }
    .controls {
      margin: 20px 0;
    }
    .control-group {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    select {
      flex: 1;
      padding: 8px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .metrics {
      margin-top: 20px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 4px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .metrics > div {
      font-size: 14px;
    }
    .error-log {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      border-left: 4px solid #f44336;
    }
    .error-log.show {
      display: block;
    }
  </style>
</head>
<body>
  <h1>SVGA Lite Demo</h1>

  <div class="controls">
    <div class="control-group">
      <select id="svga-file">
        <option value="svga/logo.svga">logo.svga</option>
        <option value="svga/angel.svga">angel.svga</option>
        <option value="svga/dragon.svga">dragon.svga</option>
        <option value="svga/loading.svga">loading.svga</option>
        <option value="svga/kaola.svga">kaola.svga</option>
        <option value="svga/TwitterHeart.svga">TwitterHeart.svga</option>
        <option value="svga/shape-path-undefined.svga">shape-path-undefined.svga</option>
        <option value="svga/story.svga">story.svga</option>
        <option value="svga/nonexistent.svga">nonexistent.svga</option>
      </select>
      <button id="load-btn" onclick="loadSVGA()">Load</button>
    </div>

    <div class="control-group">
      <button id="start-btn" onclick="window.start()" disabled>Start</button>
      <button id="pause-btn" onclick="window.pause()" disabled>Pause</button>
      <button id="resume-btn" onclick="window.resume()" disabled>Resume</button>
      <button id="stop-btn" onclick="window.stop()" disabled>Stop</button>
      <button id="clear-btn" onclick="window.clear()" disabled>Clear</button>
      <button id="destroy-btn" onclick="window.destroy()" disabled>Destroy</button>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="loop-check" checked> Loop
      </label>
      <label>
        Fill Mode:
        <select id="fill-mode">
          <option value="forwards">Forwards</option>
          <option value="backwards">Backwards</option>
        </select>
      </label>
    </div>

    <div class="metrics">
      <div>FPS: <span id="fps-value">--</span></div>
      <div>Frame Time: <span id="frame-time-value">--</span> ms</div>
      <div>Current Frame: <span id="current-frame-value">--</span></div>
      <div>Total Frames: <span id="total-frames-value">--</span></div>
    </div>

    <div class="status" id="status">
      Status: Ready. Select a file and click Load.
    </div>

    <div class="error-log" id="error-log">
      <div class="error-log-content" id="error-log-content"></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Load SVGA library from dist -->
  <script type="module" src="index.js"></script>

  <!-- Demo functionality -->
  <script>
    // Global state
    let parser = null
    let player = null
    let currentVideo = null
    let isPlaying = false

    // FPS calculation state
    let lastFrameTime = 0
    let frameCount = 0
    let fpsUpdateTimer = 0
    let currentFps = 0
    let currentFrameTime = 0
    let metricsUpdateInterval = null

    // Update button states
    function updateButtonStates () {
      const hasPlayer = !!player
      const hasVideo = !!currentVideo

      document.getElementById('start-btn').disabled = !(hasPlayer && hasVideo) || isPlaying
      document.getElementById('pause-btn').disabled = !hasPlayer || !isPlaying
      document.getElementById('resume-btn').disabled = !hasPlayer || isPlaying
      document.getElementById('stop-btn').disabled = !hasPlayer || !isPlaying
      document.getElementById('clear-btn').disabled = !hasPlayer
      document.getElementById('destroy-btn').disabled = !hasPlayer
    }

    // Reset metrics display
    function resetMetrics () {
      document.getElementById('fps-value').textContent = '--'
      document.getElementById('frame-time-value').textContent = '--'
      document.getElementById('current-frame-value').textContent = '--'
      document.getElementById('total-frames-value').textContent = '--'
    }

    // Update performance metrics
    function updateMetrics () {
      if (player) {
        const now = performance.now()
        frameCount++

        // Every 500ms, update FPS display
        if (now - fpsUpdateTimer >= 500) {
          const elapsed = now - fpsUpdateTimer
          currentFps = (frameCount * 1000) / elapsed
          frameCount = 0
          fpsUpdateTimer = now

          document.getElementById('fps-value').textContent = currentFps.toFixed(2)
          document.getElementById('frame-time-value').textContent = currentFrameTime.toFixed(2)
        }

        // Calculate frame time
        if (lastFrameTime > 0) {
          currentFrameTime = now - lastFrameTime
        }
        lastFrameTime = now

        // Update frame count
        document.getElementById('current-frame-value').textContent = player.currentFrame.toString()
      }
    }

    // Start metrics update interval
    function startMetricsUpdate () {
      if (metricsUpdateInterval) {
        clearInterval(metricsUpdateInterval)
      }
      lastFrameTime = 0
      frameCount = 0
      fpsUpdateTimer = performance.now()
      currentFps = 0
      currentFrameTime = 0
      metricsUpdateInterval = setInterval(updateMetrics, 16) // ~60fps
    }

    // Stop metrics update interval
    function stopMetricsUpdate () {
      if (metricsUpdateInterval) {
        clearInterval(metricsUpdateInterval)
        metricsUpdateInterval = null
      }
    }

    // Show error
    function showError (message) {
      const errorLog = document.getElementById('error-log')
      const errorLogContent = document.getElementById('error-log-content')
      errorLogContent.textContent = message
      errorLog.classList.add('show')
    }

    // Hide error
    function hideError () {
      const errorLog = document.getElementById('error-log')
      errorLog.classList.remove('show')
    }

    // Control functions
    window.start = function () {
      if (player && currentVideo) {
        isPlaying = true
        updateButtonStates()
        startMetricsUpdate()
        player.start()
      }
    }

    window.pause = function () {
      if (player) {
        isPlaying = false
        updateButtonStates()
        stopMetricsUpdate()
        player.pause()
      }
    }

    window.resume = function () {
      if (player) {
        isPlaying = true
        updateButtonStates()
        startMetricsUpdate()
        player.resume()
      }
    }

    window.stop = function () {
      if (player) {
        isPlaying = false
        updateButtonStates()
        stopMetricsUpdate()
        player.stop()
      }
    }

    window.clear = function () {
      if (player) {
        player.clear()
        stopMetricsUpdate()
        resetMetrics()
      }
    }

    window.destroy = function () {
      isPlaying = false
      stopMetricsUpdate()
      resetMetrics()
      hideError()
      if (player) {
        player.destroy()
        player = null
      }
      if (parser) {
        parser.destroy()
        parser = null
      }
      currentVideo = null
      updateButtonStates()
    }

    // Load SVGA function
    function loadSVGA () {
      const url = document.getElementById('svga-file').value
      const status = document.getElementById('status')

      hideError()
      status.textContent = 'Loading ' + url + '...'

      // Clear previous player
      window.destroy()

      setTimeout(function () {
        if (typeof window.Parser === 'undefined' || typeof window.Player === 'undefined') {
          status.textContent = 'Error: SVGA library not loaded. Make sure index.js is loaded.'
          console.error('Parser or Player not available', { Parser: typeof window.Parser, Player: typeof window.Player })
          return
        }

        const canvas = document.getElementById('canvas')
        parser = new window.Parser()

        parser.load(url).then(function onVideoLoaded (video) {
          currentVideo = video
          status.textContent = 'Loaded ' + url + ' successfully (' + video.frames + ' frames)'
          console.log('Loaded video:', video)

          // Update total frames display
          document.getElementById('total-frames-value').textContent = video.frames.toString()

          // Create player and mount video
          const loopCheckbox = document.getElementById('loop-check')
          const loop = loopCheckbox.checked
          const fillModeValue = document.getElementById('fill-mode').value

          player = new window.Player({
            container: canvas,
            loop: loop ? 0 : 1  // 0 = infinite, 1 = once
          })

          player.mount(video).then(function onMounted () {
            updateButtonStates()
            status.textContent = 'Ready to play. Click Start to begin.'
          }).catch(function onMountError (err) {
            console.error('Mount error:', err)
            status.textContent = 'Error mounting video: ' + err.message
            showError('Error mounting video: ' + err.message)
          })
        }).catch(function onLoadError (error) {
          status.textContent = 'Error loading ' + url + ': ' + error.message
          showError('Error: ' + error.message)
          console.error('Load error:', error)
          updateButtonStates()
        })
      }, 100)
    }

    // Update fill mode
    function updateFillMode () {
      const fillMode = document.getElementById('fill-mode').value
      console.log('Fill mode:', fillMode)
      // Note: fillMode needs to be set when creating a new player
    }

    // Update loop mode
    function updateLoopMode () {
      const loop = document.getElementById('loop-check').checked
      console.log('Loop:', loop)
    }

    // Add event listeners for settings
    document.getElementById('fill-mode').addEventListener('change', updateFillMode)
    document.getElementById('loop-check').addEventListener('change', updateLoopMode)

    // Initialize button states on page load
    updateButtonStates()

    // Log when page is loaded
    console.log('SVGA Lite Demo loaded')
    console.log('Parser available:', typeof window.Parser !== 'undefined')
    console.log('Player available:', typeof window.Player !== 'undefined')
    console.log('Available SVGA files:', Array.from(document.querySelectorAll('#svga-file option')).map(function (option) { return option.value }))
  </script>
</body>
</html>
