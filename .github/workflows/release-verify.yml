name: Release verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: 12.2.1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ensure npm
        run: |
          npm install --global npm@$NPM_VERSION
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Check release state
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "Pending changesets remain; run the Changesets workflow first."
            exit 1
          fi
          node -e "const { version } = require('./package.json'); if (!/^\\d+\\.\\d+\\.\\d+$/.test(version)) { console.error('Invalid version: ' + version); process.exit(1) }"

      - name: Verify
        run: npm run verify

      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          cd artifacts
          shasum -a 256 ./*.tgz | tee SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svga-package
          path: artifacts
          if-no-files-found: error
